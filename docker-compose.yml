services:
  api:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAME:-your-username/codequest}:${TAG:-latest}
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - CLERK_WEBHOOK_SECRET=${CLERK_WEBHOOK_SECRET}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - codequest-network
    volumes:
      - ./logs/api:/app/logs

  optimus-worker:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAME:-your-username/codequest}:${TAG:-latest}
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JUDGE0_RAPIDAPI_URL=${JUDGE0_RAPIDAPI_URL}
      - JUDGE0_RAPIDAPI_KEY=${JUDGE0_RAPIDAPI_KEY}
      - JUDGE0_SELF_HOSTED_URL=http://host.docker.internal:2358
      - JUDGE0_SELF_HOSTED_KEY=${JUDGE0_SELF_HOSTED_KEY}
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - codequest-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs/worker:/app/logs

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - codequest-network

networks:
  codequest-network:
    driver: bridge

volumes:
  redis_data:
 