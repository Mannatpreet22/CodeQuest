

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-runner
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=your_redis_password
      - CLERK_WEBHOOK_SECRET=${CLERK_WEBHOOK_SECRET}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY}
      - NEXT_PUBLIC_API_URL=http://localhost:3000
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - codequest-network

  optimus-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker-runner
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=your_redis_password
      - JUDGE0_RAPIDAPI_URL=${JUDGE0_RAPIDAPI_URL}
      - JUDGE0_RAPIDAPI_KEY=${JUDGE0_RAPIDAPI_KEY}
      - JUDGE0_SELF_HOSTED_URL=http://judge0:2358
      - JUDGE0_SELF_HOSTED_KEY=${JUDGE0_SELF_HOSTED_KEY}
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
      judge0:
        condition: service_started
    restart: unless-stopped
    networks:
      - codequest-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --requirepass your_redis_password
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - codequest-network

  judge0:
    image: judge0/judge0:latest
    volumes:
      - judge0-data:/judge0
    ports:
      - "2358:2358"
    privileged: true
    environment:
      - VIRTUAL_HOST=judge0
      - VIRTUAL_PORT=2358
      - JUDGE0_FS_ROOT=/judge0
      - RAILS_MAX_THREADS=2
      - JUDGE0_ENABLE_ADDITIONAL_FILES=true
      - JUDGE0_ENABLE_PROCESS_ISOLATION=true
      - JUDGE0_ENABLE_COMPILER_OPTIONS=true
      - JUDGE0_WORKERS=2
      - JUDGE0_MAX_QUEUE_SIZE=100
      - JUDGE0_SUBMISSION_PROCESSING_TIMEOUT=30
      - JUDGE0_ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=false
      - JUDGE0_ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=false
      - JUDGE0_CPU_TIME_LIMIT=15
      - JUDGE0_MAX_CPU_TIME_LIMIT=30
      - JUDGE0_MEMORY_LIMIT=512000
      - JUDGE0_MAX_MEMORY_LIMIT=512000
      - JUDGE0_STACK_LIMIT=128000
      - JUDGE0_MAX_STACK_LIMIT=128000
      - JUDGE0_ALLOW_ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=false
      - JUDGE0_ALLOW_ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=false
    restart: unless-stopped
    networks:
      - codequest-network

networks:
  codequest-network:
    driver: bridge

volumes:
  redis_data:
  judge0-data: