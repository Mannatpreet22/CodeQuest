name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm install
      
    - name: Ensure lock file is generated
      run: |
        if [ ! -f "package-lock.json" ]; then
          echo "Generating package-lock.json..."
          npm install --package-lock-only
        fi
      
    - name: Debug package info
      run: |
        echo "Available scripts:"
        npm run
        echo "Package-lock status:"
        ls -la package-lock.json
        echo "Node modules status:"
        ls -la node_modules/ | head -5
      
    - name: Run linting (if available)
      run: npm run lint --if-present
      
    - name: Run type checking (if available)
      run: npm run check-types --if-present
      
    - name: Build packages (if available)
      run: npm run build --if-present
      
    - name: Run tests (if available)
      run: npm test --if-present
      
  security:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run security audit
      run: npm audit --audit-level=moderate 