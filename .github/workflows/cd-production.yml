name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
        - production
        - production-rollback

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
          type=raw,value=production
          
    - name: Build and push Docker images
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Run database migrations
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.PRODUCTION_HOST }}
        username: ${{ secrets.PRODUCTION_USERNAME }}
        key: ${{ secrets.PRODUCTION_SSH_KEY }}
        script: |
          # Ensure we're in the right directory
          if [ ! -d "/var/www/codequest" ]; then
            echo "Production directory not found, creating it..."
            mkdir -p /var/www/codequest
          fi
          cd /var/www/codequest
          # Run migrations if you have a database service, otherwise skip
          if docker-compose ps | grep -q "db"; then
            docker-compose exec -T db npx prisma migrate deploy
          else
            echo "No database service found, skipping migrations"
          fi
          
    - name: Deploy to production server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.PRODUCTION_HOST }}
        username: ${{ secrets.PRODUCTION_USERNAME }}
        key: ${{ secrets.PRODUCTION_SSH_KEY }}
        script: |
          # Ensure we're in the right directory
          if [ ! -d "/var/www/codequest" ]; then
            echo "Production directory not found, creating it..."
            mkdir -p /var/www/codequest
          fi
          cd /var/www/codequest
          
          # Create backup before deployment (if database service exists)
          if docker-compose ps | grep -q "db"; then
            docker-compose exec -T db pg_dump $DATABASE_URL > backup_$(date +%Y%m%d_%H%M%S).sql
          else
            echo "No database service found, skipping backup"
          fi
          
          # Pull new images
          docker-compose pull
          
          # Deploy with zero-downtime
          docker-compose up -d --no-deps --scale api=2 --scale optimus-worker=2
          
          # Wait for health checks
          sleep 30
          
          # Check if new containers are healthy
          if docker-compose ps | grep -q "unhealthy"; then
            echo "New deployment is unhealthy, rolling back..."
            docker-compose up -d --no-deps --scale api=1 --scale optimus-worker=1
            exit 1
          fi
          
          # Remove old containers
          docker-compose up -d --no-deps
          docker system prune -f
          
    - name: Health check
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.PRODUCTION_HOST }}
        username: ${{ secrets.PRODUCTION_USERNAME }}
        key: ${{ secrets.PRODUCTION_SSH_KEY }}
        script: |
          # Ensure we're in the right directory
          if [ ! -d "/var/www/codequest" ]; then
            echo "Production directory not found, creating it..."
            mkdir -p /var/www/codequest
          fi
          cd /var/www/codequest
          
          # Wait for services to be ready
          sleep 10
          
          # Check API health
          if ! curl -f http://localhost:3000/health; then
            echo "API health check failed"
            exit 1
          fi
          
          # Check worker health (basic check since worker may not have health endpoint)
          if ! docker-compose ps optimus-worker | grep -q "Up"; then
            echo "Worker container is not running"
            exit 1
          fi
          
          echo "All services are healthy!"
          
 