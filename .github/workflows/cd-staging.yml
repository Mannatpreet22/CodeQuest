name: Deploy to Staging (Same Server)

on:
  push:
    branches: [ develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=staging,enable={{is_default_branch}}
          
    - name: Extract metadata for worker
      id: meta-worker
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-worker
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=staging,enable={{is_default_branch}}
          
    - name: Build and push API image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        target: api-runner
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Build and push Worker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        target: worker-runner
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta-worker.outputs.tags }}
        labels: ${{ steps.meta-worker.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Deploy to staging server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.PRODUCTION_HOST }}
        username: ${{ secrets.PRODUCTION_USERNAME }}
        key: ${{ secrets.PRODUCTION_SSH_KEY }}
        script: |
          # Deploy to staging directory on same server
          mkdir -p /var/www/codequest-staging
          cd /var/www/codequest-staging
          
          # Copy production docker-compose if staging doesn't exist
          if [ ! -f "docker-compose.yml" ]; then
            cp /var/www/codequest/docker-compose.yml .
            cp /var/www/codequest/.env .
          fi
          
          # Set staging port to avoid conflicts
          export API_PORT=3001
          
          # Update docker-compose to use staging images
          if [ ! -f "docker-compose.yml" ]; then
            echo "docker-compose.yml not found, creating it..."
            cat > docker-compose.yml << 'EOF'
          services:
            api:
              image: ghcr.io/${{ github.repository }}-api:staging
              ports:
                - "3001:3000"
              environment:
                - NODE_ENV=staging
                - DATABASE_URL=${DATABASE_URL}
                - REDIS_HOST=redis
                - REDIS_PORT=6379
                - REDIS_PASSWORD=${REDIS_PASSWORD}
                - CLERK_WEBHOOK_SECRET=${CLERK_WEBHOOK_SECRET}
                - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
                - CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY}
                - API_URL=${API_URL:-http://localhost:3001}
              depends_on:
                redis:
                  condition: service_healthy
              healthcheck:
                test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
                interval: 30s
                timeout: 10s
                retries: 3
                start_period: 40s
              restart: unless-stopped
              networks:
                - codequest-network
              volumes:
                - ./logs/api:/app/logs

            optimus-worker:
              image: ghcr.io/${{ github.repository }}-worker:staging
              environment:
                - NODE_ENV=staging
                - DATABASE_URL=${DATABASE_URL}
                - REDIS_URL=redis://redis:6379
                - REDIS_HOST=redis
                - REDIS_PORT=6379
                - REDIS_PASSWORD=${REDIS_PASSWORD}
                - JUDGE0_RAPIDAPI_URL=${JUDGE0_RAPIDAPI_URL}
                - JUDGE0_RAPIDAPI_KEY=${JUDGE0_RAPIDAPI_KEY}
                - JUDGE0_SELF_HOSTED_URL=http://host.docker.internal:2358
                - JUDGE0_SELF_HOSTED_KEY=${JUDGE0_SELF_HOSTED_KEY}
              depends_on:
                redis:
                  condition: service_healthy
              restart: unless-stopped
              networks:
                - codequest-network
              extra_hosts:
                - "host.docker.internal:host-gateway"
              volumes:
                - ./logs/worker:/app/logs

            redis:
              image: redis:7-alpine
              ports:
                - "6380:6379"
              command: redis-server --requirepass ${REDIS_PASSWORD}
              volumes:
                - redis_data:/data
              healthcheck:
                test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
                interval: 10s
                timeout: 5s
                retries: 5
                start_period: 10s
              restart: unless-stopped
              networks:
                - codequest-network

          networks:
            codequest-network:
              driver: bridge

          volumes:
            redis_data:
          EOF
          fi
          
          # Create logs directory if it doesn't exist
          mkdir -p logs/api logs/worker
          
          docker-compose pull
          docker-compose down
          docker-compose up -d
          docker system prune -f 