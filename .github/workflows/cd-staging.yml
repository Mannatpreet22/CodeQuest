name: Sync Files to Staging

on:
  push:
    branches: [ develop ]

jobs:
  sync-files:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Copy docker-compose.yml to staging
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.PRODUCTION_HOST }}
        username: ${{ secrets.PRODUCTION_USERNAME }}
        key: ${{ secrets.PRODUCTION_SSH_KEY }}
        source: "docker-compose.yml"
        target: "/var/www/codequest-staging/"
        
    - name: Sync files to staging server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.PRODUCTION_HOST }}
        username: ${{ secrets.PRODUCTION_USERNAME }}
        key: ${{ secrets.PRODUCTION_SSH_KEY }}
        script: |
          # Create staging directory
          mkdir -p /var/www/codequest-staging
          cd /var/www/codequest-staging
          
          # Remove old files
          rm -rf *
          
          # Create .env file for staging
          cat > .env << 'EOF'
          # Staging Environment
          NODE_ENV=staging
          API_PORT=3001
          DATABASE_URL=${DATABASE_URL}
          REDIS_PASSWORD=${REDIS_PASSWORD}
          CLERK_WEBHOOK_SECRET=${CLERK_WEBHOOK_SECRET}
          CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
          CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY}
          API_URL=https://api.codequest.com
          JUDGE0_RAPIDAPI_URL=${JUDGE0_RAPIDAPI_URL}
          JUDGE0_RAPIDAPI_KEY=${JUDGE0_RAPIDAPI_KEY}
          JUDGE0_SELF_HOSTED_URL=http://host.docker.internal:2358
          JUDGE0_SELF_HOSTED_KEY=${JUDGE0_SELF_HOSTED_KEY}
          EOF
          
          echo "Files synced to staging. Run 'docker-compose up -d' manually to deploy." 